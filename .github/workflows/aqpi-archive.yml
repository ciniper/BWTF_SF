name: Archive AQPI rainfall

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aqpi-archive
  cancel-in-progress: false

jobs:
  archive:
    # Explicit activation after review/approval; PRs and branch pushes never run it.
    if: github.repository == 'ciniper/BWTF_SF' && github.ref == 'refs/heads/main' && vars.AQPI_ARCHIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aqpi-archive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-aqpi-archive.txt
      - name: Install collector dependencies
        run: python -m pip install -r scripts/requirements-aqpi-archive.txt
      - name: Capture and archive both feeds
        env:
          AQPI_ARCHIVE_SUPABASE_URL: ${{ secrets.AQPI_ARCHIVE_SUPABASE_URL }}
          AQPI_ARCHIVE_SUPABASE_KEY: ${{ secrets.AQPI_ARCHIVE_SUPABASE_KEY }}
          AQPI_ARCHIVE_BUCKET: aqpi-archive
        run: python -m features.alerts.aqpi_archive --output "$RUNNER_TEMP/aqpi-archive" --upload
      - name: Preserve recovery spool after failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aqpi-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aqpi-archive/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
